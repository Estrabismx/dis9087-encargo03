<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visión Web - Panel Dual</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Carga clásica, síncrona y segura -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <h2 id="loading-text">Cargando Motores de IA...</h2>
    </div>

    <!-- PANTALLA DIVIDIDA -->
    <div id="pantalla-dividida">
        
        <!-- VENTANA 1: MediaPipe (Tu Iris) -->
        <div id="ventana-mp" class="ventana">
            <h3 class="titulo-ventana">Tu Iris (¿Dónde Mirás?)</h3>
            <video id="video-mp" playsinline muted></video>
            <div id="puntero"></div>
        </div>

        <!-- VENTANA 2: OpenCV (El Entorno) -->
        <div id="ventana-cv" class="ventana">
            <h3 class="titulo-ventana">El Entorno (Oscurece si mirás)</h3>
            <video id="video-cv" playsinline muted></video>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
