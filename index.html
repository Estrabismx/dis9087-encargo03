<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesamiento Visual: OpenCV & MediaPipe</title>
    
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="style.css">
    
    <!-- En el <head> o antes de cerrar el <body> -->
    <!-- Cargamos OpenCV.js de forma asíncrona. Puede tardar un par de segundos en inicializar -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>

</head>
<body>

    <div id="contenedor-principal">
        
        <h1>Análisis de Visión Artificial</h1>

        <div id="contenedor-ventanas">

            <!-- VENTANA 1: OPENCV -->
            <div class="ventana">
                <h2>Procesamiento con OpenCV</h2>
                <canvas id="canvasOpenCV" width="640" height="480"></canvas>
            </div>

            <!-- VENTANA 2: MEDIAPIPE -->
            <div class="ventana">
                <h2>Interpretación de MediaPipe</h2>
                <canvas id="canvasMediaPipe" width="640" height="480"></canvas>
            </div>

        </div> 
        
        <!-- Video oculto (ELEMENTO TÉCNICO) -->
        <video id="videoOculto" width="640" height="480" autoplay playsinline></video>

    </div> 


<!-- ... final de tu HTML ... -->
<!-- Primero cargas tus procesadores -->
<script src="detectorMovimiento.js"></script>
<script src="detector_ojos.js"></script>

<!-- Al final cargas el orquestador que los usa -->
<script src="main.js"></script>
</body>
</html>
